notes: >-
  Autodesk Platform Services (APS, formerly Forge) ships official first-party SDKs for Node.js and
  .NET, split into per-service packages coordinated by a shared SDK Manager. There is no official
  first-party Python or Java SDK on PyPI/Maven at this time (community packages exist but are not
  first-party). The Viewer is delivered as a hosted JS library, not a registry package (see
  components/autodesk-components.yml).
