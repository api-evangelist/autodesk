  APS exposes client-side, embeddable UI surfaces distinct from the server-side SDKs in
  packages/. The flagship is the Viewer — a hosted JavaScript library that renders 2D/3D
  design models (SVF/SVF2) in the browser with a customizable toolbar and extension framework.
